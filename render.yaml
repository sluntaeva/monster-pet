services:
  - type: web
    name: monster-pet
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: monster-pet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH
        value: "0"
      - key: DATABASE_PATH
        value: /var/data/monster-pet.sqlite
      - key: ENABLE_BOT_WEBHOOK
        value: "1"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
